name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check generated code is in sync
        if: matrix.os == 'ubuntu-latest'
        run: make check-gen
      - name: Build C tests
        run: make
      - name: Deterministic-1024 KAT tests
        run: ./tests/test_deterministic1024
      - name: Deterministic-512 KAT tests
        run: ./tests/test_deterministic512
      - name: Falcon tests
        run: ./tests/test_falcon
      - name: Speed smoke test
        run: ./tests/speed 1
      - name: Go tests
        run: go test -v ./...
